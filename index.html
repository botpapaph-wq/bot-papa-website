<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOT PAPA – AI Phone Receptionist for Trades & Service Pros</title>
  <meta name="description" content="BOT PAPA builds custom AI phone receptionists for small trades and service businesses. Stop missing calls while you are on the roof, on site or with clients." />

  <style>
    :root {
      --bg: #050816;
      --bg-soft: #0b1020;
      --accent: #00e0ff;
      --accent-soft: rgba(0, 224, 255, 0.12);
      --text: #f5f7ff;
      --muted: #a3aac2;
      --danger: #ff4b6b;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.45);
      --radius-lg: 18px;
      --radius-full: 999px;
      --border-soft: 1px solid rgba(255, 255, 255, 0.07);
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background: radial-gradient(circle at top, #101735 0, #050816 55%, #02030a 100%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 16px;
      margin-bottom: 32px;
      border-radius: var(--radius-full);
      border: var(--border-soft);
      background: linear-gradient(135deg, rgba(0, 224, 255, 0.12), transparent);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-soft);
      position: sticky;
      top: 16px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Rund, kompakter, Logo im Kreis maximal groß */
    .brand-mark {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-mark img {
      width: 110%;
      height: 110%;
      object-fit: contain;
      display: block;
    }

    .brand-text-title {
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 14px;
    }

    .brand-text-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill {
      border-radius: var(--radius-full);
      padding: 6px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: var(--border-soft);
      color: var(--muted);
      background: rgba(5, 8, 22, 0.9);
    }

    .pill strong {
      color: var(--accent);
    }

    .btn-primary {
      border-radius: var(--radius-full);
      padding: 9px 18px;
      border: none;
      outline: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00e0ff, #7b3fff);
      color: #050816;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary span {
      font-size: 16px;
      transform: translateY(1px);
    }

    .btn-primary:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      filter: brightness(0.98);
      transform: translateY(0);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
    }

    .btn-secondary {
      border-radius: var(--radius-full);
      padding: 8px 14px;
      font-size: 12px;
      border: var(--border-soft);
      color: var(--muted);
      background: rgba(5, 8, 22, 0.9);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary span {
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      gap: 32px;
      align-items: stretch;
    }

    .hero {
      padding: 26px 24px 24px;
      border-radius: var(--radius-lg);
      border: var(--border-soft);
      background: radial-gradient(circle at top left, rgba(0, 224, 255, 0.08), transparent 55%),
        linear-gradient(145deg, rgba(14, 21, 47, 0.95), rgba(3, 5, 16, 0.98));
      box-shadow: var(--shadow-soft);
    }

    .hero-kicker {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .hero-title {
      font-size: clamp(26px, 3.1vw, 32px);
      line-height: 1.12;
      margin: 0 0 12px;
    }

    .hero-title span {
      color: var(--accent);
    }

    .hero-sub {
      font-size: 14px;
      color: var(--muted);
      max-width: 580px;
      margin-bottom: 18px;
    }

    .hero-sub-2 {
      font-size: 13px;
      color: var(--muted);
      max-width: 580px;
      margin-bottom: 18px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .hero-meta span {
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: rgba(0, 0, 0, 0.36);
      border: var(--border-soft);
    }

    .card {
      padding: 18px 16px;
      border-radius: var(--radius-lg);
      border: var(--border-soft);
      background: linear-gradient(155deg, rgba(8, 13, 34, 0.97), rgba(2, 4, 13, 0.98));
      box-shadow: var(--shadow-soft);
      font-size: 13px;
    }

    .card-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .card-title strong {
      color: var(--accent);
    }

    .list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .list li { margin-bottom: 6px; }

    .section {
      margin-top: 28px;
      padding: 20px 18px;
      border-radius: var(--radius-lg);
      border: var(--border-soft);
      background: linear-gradient(155deg, rgba(8, 13, 34, 0.95), rgba(2, 4, 13, 0.98));
      box-shadow: var(--shadow-soft);
      font-size: 14px;
    }

    .section h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .section p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .section-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 12px;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }

    .contact-item strong {
      color: var(--text);
    }

    footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
    }

    @media (max-width: 768px) {
      header {
        position: static;
        border-radius: 14px;
        padding: 10px 12px;
      }
      .grid {
        grid-template-columns: minmax(0, 1fr);
      }
      .hero {
        padding: 22px 18px 18px;
      }
    }
  </style>
</head>
